<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ventaniYA Soluciones - Álbum de Estampillas</title>
  <style>
    body { font-family: 'Courier New', monospace; background: #f4f1ea; color: #333; max-width: 900px; margin: 0 auto; padding: 20px; }
    h1, h2 { text-align: center; border-bottom: 2px dashed #b5a48b; padding-bottom: 10px; }
    .admin-panel { background: #e8e3d5; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .card { background: #fff; border: 1px solid #dcd6cc; padding: 10px; border-radius: 4px; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid #eee; margin-bottom: 8px; }
    input, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <h1>ventaniYA Soluciones</h1>
  <h2>Álbum de Estampillas y Postcards</h2>

  <!-- Panel de Administración (Oculto hasta loguearse) -->
  <div id="adminSection" class="admin-panel" style="display:none;">
    <h3>Panel de Administración</h3>
    <p>Conectado como: <span id="userEmail"></span> <button onclick="cerrarSesion()" style="width:auto; display:inline;">Salir</button></p>
    <form id="formEstampilla" onsubmit="subirEstampilla(event)">
      <input type="text" id="tituloEstampilla" placeholder="Título / Descripción" required>
      <input type="file" id="imagenEstampilla" accept="image/*" required>
      <button type="submit">Guardar Estampilla en el Álbum</button>
    </form>
  </div>

  <!-- Login simple para el Admin -->
  <div id="loginSection" class="admin-panel">
    <h3>Acceso Administrador</h3>
    <input type="email" id="loginEmail" placeholder="Correo" value="misterkong69@gmail.com">
    <input type="password" id="loginPassword" placeholder="Contraseña">
    <button onclick="iniciarSesion()">Entrar</button>
  </div>

  <hr>

  <h3>Galería Pública</h3>
  <div id="galeria" class="gallery"></div>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "albumestampiyadescarga.firebaseapp.com",
      projectId: "albumestampiyadescarga",
      storageBucket: "albumestampiyadescarga.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "1:1033256533057:web:4797bd6ed0f5a92cbdac0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Control de estado de sesión
    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('adminSection').style.display = 'block';
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('userEmail').innerText = user.email;
      } else {
        document.getElementById('adminSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
      }
    });

    function iniciarSesion() {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      auth.signInWithEmailAndPassword(email, pass).catch(err => alert("Error: " + err.message));
    }

    function cerrarSesion() {
      auth.signOut();
    }

    // Subir imagen optimizada directo a Firestore en Base64 (evita Storage y costos)
    async function subirEstampilla(event) {
      event.preventDefault();
      const titulo = document.getElementById('tituloEstampilla').value;
      const archivo = document.getElementById('imagenEstampilla').files[0];
      
      if (!archivo) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        // Reducimos un poco la imagen convirtiéndola a canvas para que no pese en Firestore
        const img = new Image();
        img.src = e.target.result;
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

          try {
            await db.collection("estampillas").add({
              titulo: titulo,
              imagenUrl: compressedBase64,
              fecha: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("¡Estampilla guardada con éxito!");
            document.getElementById('formEstampilla').reset();
            cargarGaleria();
          } catch (err) {
            alert("Error al guardar: " + err.message);
          }
        }
      };
      reader.readAsDataURL(archivo);
    }

    // Cargar la galería pública en pantalla
    async function cargarGaleria() {
      const contenedor = document.getElementById('galeria');
      contenedor.innerHTML = "Cargando galería...";
      
      try {
        const snapshot = await db.collection("estampillas").orderBy("fecha", "desc").get();
        contenedor.innerHTML = "";
        
        if(snapshot.empty) {
          contenedor.innerHTML = "<p>No hay estampillas todavía.</p>";
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${data.imagenUrl}" alt="${data.titulo}">
            <h4>${data.titulo}</h4>
          `;
          contenedor.appendChild(card);
        });
      } catch (err) {
        contenedor.innerHTML = "Error al cargar la galería.";
      }
    }

    // Cargar al iniciar la página
    cargarGaleria();
  </script>
</body>
</html>
