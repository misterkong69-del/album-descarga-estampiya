<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstampiYA - Postal de Mardelwood</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --secondary-color: #f4f1ea;
            --accent-color: #00ffff;
            --text-color: #202124;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        header p {
            color: #5f6368;
            font-size: 0.9rem;
            margin-top: 0;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid #d0c5b4;
        }
        .hidden {
            display: none !important;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #dadce0;
            border-radius: 4px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #1557b0;
        }
        .btn-danger {
            background-color: #d93025;
        }
        .btn-danger:hover {
            background-color: #b31412;
        }
        .btn-secondary {
            background-color: #5f6368;
        }
        .btn-secondary:hover {
            background-color: #3c4043;
        }
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .item-card {
            border: 1px solid #d0c5b4;
            border-radius: 8px;
            padding: 15px;
            background: #faf8f5;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }
        .item-card img {
            max-width: 100%;
            height: auto;
            border-radius: 2px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
        }
        .card-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
        }
        .card-actions button {
            padding: 6px 10px;
            font-size: 0.8rem;
        }
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dadce0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>EstampiYA - Álbum Postal de Mardelwood</h1>
            <p>Capital de la Reposera | Sello Atómico <strong>ventaniYA Soluciones</strong></p>
        </header>

        <!-- SECCIÓN DE LOGIN -->
        <div id="login-section">
            <h2>Iniciar Sesión</h2>
            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" placeholder="misterkong69@gmail.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Tu contraseña">
            </div>
            <button id="login-btn">Ingresar</button>
            <p id="login-error" style="color: #d93025; margin-top: 10px;"></p>
        </div>

        <!-- SECCIÓN PRINCIPAL DEL ÁLBUM -->
        <div id="app-section" class="hidden">
            <div class="user-bar">
                <span id="user-display"></span>
                <button id="logout-btn" class="btn-danger">Cerrar Sesión</button>
            </div>

            <h2 id="form-title-heading">Crear Nueva Postal con Sello Atómico</h2>
            <input type="hidden" id="edit-doc-id" value="">
            
            <div class="form-group">
                <label for="item-title">Título de la Postal:</label>
                <input type="text" id="item-title">
            </div>
            <div class="form-group">
                <label for="item-type">Formato:</label>
                <select id="item-type">
                    <option value="Postal">Postal Clásica con Bordes Dentados</option>
                    <option value="Estampilla">Estampilla Gigante</option>
                </select>
            </div>
            <div class="form-group">
                <label for="item-desc">Mensaje / Leyenda:</label>
                <textarea id="item-desc" rows="2" placeholder="Obras, playa y tragos para todos..."></textarea>
            </div>
            <div class="form-group">
                <label for="item-image">Imagen de la Obra:</label>
                <input type="file" id="item-image" accept="image/*">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="save-item-btn">Generar Postal y Guardar</button>
                <button id="cancel-edit-btn" class="btn-secondary hidden">Cancelar Edición</button>
            </div>

            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #dadce0;">

            <h2>Mi Colección de Postales</h2>
            <div id="collection-grid" class="item-grid">
                <!-- Elementos cargados -->
            </div>
        </div>
    </div>

    <!-- SCRIPT DE FIREBASE Y LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPTCtTAzI0UiB-4GNDmdPFAQBhq9feR9c",
            authDomain: "albumestampiyadescarga.firebaseapp.com",
            databaseURL: "https://albumestampiyadescarga-default-rtdb.firebaseio.com",
            projectId: "albumestampiyadescarga",
            storageBucket: "albumestampiyadescarga.firebasestorage.app",
            messagingSenderId: "1033256533057",
            appId: "1:1033256533057:web:4797bd6ed0f5a92c8bdac0",
            measurementId: "G-HLGF51TSCZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginSection = document.getElementById("login-section");
        const appSection = document.getElementById("app-section");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const loginError = document.getElementById("login-error");
        const userDisplay = document.getElementById("user-display");
        
        const saveItemBtn = document.getElementById("save-item-btn");
        const cancelEditBtn = document.getElementById("cancel-edit-btn");
        const formTitleHeading = document.getElementById("form-title-heading");
        const editDocIdInput = document.getElementById("edit-doc-id");
        const collectionGrid = document.getElementById("collection-grid");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add("hidden");
                appSection.classList.remove("hidden");
                userDisplay.textContent = `Conectado: ${user.email}`;
                loadCollection();
            } else {
                loginSection.classList.remove("hidden");
                appSection.classList.add("hidden");
            }
        });

        loginBtn.addEventListener("click", async () => {
            loginError.textContent = "";
            try {
                await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
            } catch (error) {
                loginError.textContent = "Error al entrar: Verificá tus credenciales.";
            }
        });

        logoutBtn.addEventListener("click", () => {
            signOut(auth);
        });

        function generateUniqueHash() {
            return "MDW-VY-" + Math.random().toString(36).substring(2, 8).toUpperCase() + "-" + Date.now().toString(36).toUpperCase();
        }

        function getAtomicTimestamp(dateObj) {
            const d = dateObj ? new Date(dateObj) : new Date();
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const seconds = String(d.getSeconds()).padStart(2, '0');
            const ms = String(d.getMilliseconds()).padStart(3, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}.${ms}`;
        }

        // Generar Postal Real con bordes dentados, línea de tiempo integrada gigante y sellos postales clásicos
        function processMardelwoodPostalImage(file, titleText, customTimestamp, customHash) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");

                        const baseWidth = 1100;
                        const baseHeight = 900; // formato postal espacioso

                        canvas.width = baseWidth;
                        canvas.height = baseHeight;

                        // 1. Fondo de papel postal vintage cálido (Color marfil/crema real de postal)
                        ctx.fillStyle = "#fdfbf7";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        // Efecto de bordes dentados / perforados de estampilla alrededor de toda la postal
                        ctx.fillStyle = "#ffffff";
                        const dotRadius = 10;
                        const spacingX = 35;
                        const spacingY = 35;
                        
                        // Recortar círculos en los bordes para simular perforación de sello
                        for (let x = 20; x < canvas.width; x += spacingX) {
                            ctx.beginPath(); ctx.arc(x, 10, dotRadius, 0, Math.PI * 2); ctx.fill();
                            ctx.beginPath(); ctx.arc(x, canvas.height - 10, dotRadius, 0, Math.PI * 2); ctx.fill();
                        }
                        for (let y = 20; y < canvas.height; y += spacingY) {
                            ctx.beginPath(); ctx.arc(10, y, dotRadius, 0, Math.PI * 2); ctx.fill();
                            ctx.beginPath(); ctx.arc(canvas.width - 10, y, dotRadius, 0, Math.PI * 2); ctx.fill();
                        }

                        // Marco postal clásico interno
                        ctx.strokeStyle = "#c8b996";
                        ctx.lineWidth = 3;
                        ctx.strokeRect(25, 25, canvas.width - 50, canvas.height - 50);

                        // 2. Imagen principal de la postal
                        const margin = 50;
                        const imgAreaWidth = canvas.width - (margin * 2);
                        const imgAreaHeight = 480;
                        
                        let drawW = imgAreaWidth;
                        let drawH = (img.height * drawW) / img.width;
                        if (drawH > imgAreaHeight) {
                            drawH = imgAreaHeight;
                            drawW = (img.width * drawH) / img.height;
                        }
                        const drawX = margin + (imgAreaWidth - drawW) / 2;
                        const drawY = margin + 10;

                        // Sombra y marco de la foto
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(drawX - 5, drawY - 5, drawW + 10, drawH + 10);
                        ctx.strokeStyle = "#d0c5b4";
                        ctx.lineWidth = 1;
                        ctx.strokeRect(drawX - 5, drawY - 5, drawW + 10, drawH + 10);
                        ctx.drawImage(img, drawX, drawY, drawW, drawH);

                        // 3. LÍNEA DE TIEMPO INTEGRADA AL MEDIO (GRANDE, EL DOBLE DE TAMAÑO)
                        // Placa traslúcida oscura para destacar los números digitales estilo Casio
                        const tsBoxY = drawY + drawH + 20;
                        const tsBoxHeight = 85;
                        
                        ctx.fillStyle = "rgba(18, 20, 24, 0.92)";
                        ctx.fillRect(margin, tsBoxY, canvas.width - (margin * 2), tsBoxHeight);

                        ctx.strokeStyle = "#00ffff";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(margin, tsBoxY, canvas.width - (margin * 2), tsBoxHeight);

                        // Texto de línea de tiempo gigante en Cian Brillante (#00ffff)
                        ctx.fillStyle = "#00ffff";
                        ctx.font = "bold 26px monospace";
                        ctx.fillText(`[TS]: ${customTimestamp}`, margin + 25, tsBoxY + 38);
                        ctx.font = "bold 20px monospace";
                        ctx.fillText(`[HASH]: ${customHash}`, margin + 25, tsBoxY + 68);

                        // 4. ZONA INFERIOR: SELLOS POSTALES DE CORREO CÓSMICO Y VENTANIYA
                        const footerY = tsBoxY + tsBoxHeight + 20;

                        // Sello postal izquierdo: ventaniYA / EstampiYA
                        ctx.strokeStyle = "#1a73e8";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(margin, footerY, 320, 95);
                        
                        ctx.fillStyle = "#1a73e8";
                        ctx.font = "bold 13px Arial";
                        ctx.fillText("★ ventaniYA Soluciones ★", margin + 15, footerY + 25);
                        ctx.font = "bold 15px monospace";
                        ctx.fillStyle = "#202124";
                        ctx.fillText("SELLO ATÓMICO ESTAMPIYA", margin + 15, footerY + 52);
                        ctx.font = "11px sans-serif";
                        ctx.fillStyle = "#5f6368";
                        ctx.fillText(`POSTAL OFICIAL: ${titleText.toUpperCase()}`, margin + 15, footerY + 78);

                        // Sello postal derecho estilo Correo Cósmico Mardelwood (Tinta clásica de correo)
                        const stampRightX = canvas.width - margin - 320;
                        ctx.strokeStyle = "#c5221f";
                        ctx.lineWidth = 3;
                        ctx.strokeRect(stampRightX, footerY, 320, 95);

                        ctx.fillStyle = "#c5221f";
                        ctx.font = "bold 14px Arial";
                        ctx.fillText("CORREO CÓSMICO MARDELWOOD", stampRightX + 15, footerY + 25);
                        ctx.font = "bold 12px monospace";
                        ctx.fillText("CAPITAL DE LA REPOSERA", stampRightX + 15, footerY + 50);
                        ctx.font = "italic 11px sans-serif";
                        ctx.fillText("Habilitado para la Bristol y el Gabinete de Lujo", stampRightX + 15, footerY + 76);

                        resolve(canvas.toDataURL("image/jpeg", 0.95));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Guardar o Actualizar Elemento
        saveItemBtn.addEventListener("click", async () => {
            const title = document.getElementById("item-title").value;
            const desc = document.getElementById("item-desc").value;
            const imageFile = document.getElementById("item-image").files[0];
            const editId = editDocIdInput.value;

            if (!title) {
                alert("Por favor ingresá un título para la postal.");
                return;
            }

            if (!editId && !imageFile) {
                alert("Seleccioná una imagen para generar la postal.");
                return;
            }

            saveItemBtn.disabled = true;
            saveItemBtn.textContent = "Estampando Postal...";

            try {
                let base64Image = null;
                const uniqueHash = generateUniqueHash();
                const formattedTimestamp = getAtomicTimestamp();

                if (imageFile) {
                    base64Image = await processMardelwoodPostalImage(imageFile, title, formattedTimestamp, uniqueHash);
                }

                if (editId) {
                    const updateData = { title, desc, updatedAt: new Date().toISOString() };
                    if (base64Image) updateData.image = base64Image;

                    await updateDoc(doc(db, "items", editId), updateData);
                    alert("¡Postal actualizada correctamente!");
                    resetForm();
                } else {
                    await addDoc(collection(db, "items"), {
                        title,
                        desc,
                        image: base64Image,
                        hash: uniqueHash,
                        timestamp: formattedTimestamp,
                        createdAt: new Date().toISOString()
                    });
                    alert("¡Postal clásica de Mardelwood generada y guardada con éxito!");
                    document.getElementById("item-title").value = "";
                    document.getElementById("item-desc").value = "";
                    document.getElementById("item-image").value = "";
                }

                loadCollection();
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Ocurrió un error al procesar la postal.");
            } finally {
                saveItemBtn.disabled = false;
                saveItemBtn.textContent = "Generar Postal y Guardar";
            }
        });

        // Cargar colección
        async function loadCollection() {
            collectionGrid.innerHTML = "<p>Cargando colección...</p>";
            try {
                const q = query(collection(db, "items"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                collectionGrid.innerHTML = "";
                if (querySnapshot.empty) {
                    collectionGrid.innerHTML = "<p>El álbum está vacío. ¡Generá tu primera postal clásica!</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;

                    const card = document.createElement("div");
                    card.className = "item-card";
                    card.innerHTML = `
                        <img src="${data.image || ''}" alt="${data.title}">
                        <h3>${data.title}</h3>
                        <p><small>${data.desc || ""}</small></p>
                        <div class="card-actions">
                            <button class="btn-secondary download-btn" data-img="${data.image}" data-title="${data.title}">Descargar Postal</button>
                            <button class="btn-secondary edit-btn" data-id="${docId}" data-title="${data.title}" data-desc="${data.desc || ""}">Editar</button>
                            <button class="btn-danger delete-btn" data-id="${docId}">Borrar</button>
                        </div>
                    `;
                    collectionGrid.appendChild(card);
                });

                document.querySelectorAll(".download-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        const imgSrc = e.target.getAttribute("data-img");
                        const imgTitle = e.target.getAttribute("data-title") || "postal_mardelwood";
                        const a = document.createElement("a");
                        a.href = imgSrc;
                        a.download = `${imgTitle.replace(/\s+/g, '_')}_Mardelwood.jpg`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    });
                });

                document.querySelectorAll(".edit-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        editDocIdInput.value = e.target.getAttribute("data-id");
                        document.getElementById("item-title").value = e.target.getAttribute("data-title");
                        document.getElementById("item-desc").value = e.target.getAttribute("data-desc");
                        
                        formTitleHeading.textContent = "Editar Postal";
                        saveItemBtn.textContent = "Guardar Cambios";
                        cancelEditBtn.classList.remove("hidden");
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                });

                document.querySelectorAll(".delete-btn").forEach(btn => {
                    btn.addEventListener("click", async (e) => {
                        if (confirm("¿Estás seguro de eliminar esta postal?")) {
                            const id = e.target.getAttribute("data-id");
                            await deleteDoc(doc(db, "items", id));
                            loadCollection();
                        }
                    });
                });

            } catch (error) {
                console.error("Error al cargar colección:", error);
                collectionGrid.innerHTML = "<p>Error al cargar el álbum.</p>";
            }
        }

        cancelEditBtn.addEventListener("click", () => {
            resetForm();
        });

        function resetForm() {
            editDocIdInput.value = "";
            document.getElementById("item-title").value = "";
            document.getElementById("item-desc").value = "";
            document.getElementById("item-image").value = "";
            formTitleHeading.textContent = "Crear Nueva Postal con Sello Atómico";
            saveItemBtn.textContent = "Generar Postal y Guardar";
            cancelEditBtn.classList.add("hidden");
        }
    </script>
</body>
</html>
