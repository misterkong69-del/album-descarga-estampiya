<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstampiYA - Archivo Público Mardelwood</title>
    <!-- SDKs de Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-color: #1a73e8;
            --secondary-color: #f4f1ea;
            --accent-color: #00ffff;
            --text-color: #202124;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        header p {
            color: #5f6368;
            font-size: 0.9rem;
            margin-top: 0;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid #d0c5b4;
        }
        .hidden {
            display: none !important;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #dadce0;
            border-radius: 4px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #1557b0;
        }
        .btn-danger {
            background-color: #d93025;
        }
        .btn-danger:hover {
            background-color: #b31412;
        }
        .btn-secondary {
            background-color: #5f6368;
        }
        .btn-secondary:hover {
            background-color: #3c4043;
        }
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .item-card {
            border: 1px solid #d0c5b4;
            border-radius: 8px;
            padding: 15px;
            background: #faf8f5;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }
        .item-card img {
            max-width: 100%;
            height: auto;
            border-radius: 2px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
        }
        .card-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
        }
        .card-actions button {
            padding: 6px 10px;
            font-size: 0.8rem;
        }
        #upload-section {
            background: #e8f0fe;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
            border: 1px solid #b4d5fe;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>EstampiYA - Archivo Oficial de Mardelwood</h1>
            <p>Capital de la Reposera | Galería Pública en Tiempo Real</p>
        </header>

        <!-- PANEL DE SUBIDA -->
        <div id="upload-section">
            <h2 id="form-title-heading" style="margin-top:0; color: #1a73e8;">Crear Nueva Postal Caótica</h2>
            <input type="hidden" id="edit-id" value="">
            
            <div class="form-group">
                <label for="item-title">Título de la Obra / Edición:</label>
                <input type="text" id="item-title" placeholder="Ej: Estamos en Mar del Wood">
            </div>
            <div class="form-group">
                <label for="item-desc">Mensaje / Leyenda:</label>
                <textarea id="item-desc" rows="2" placeholder="Saludos desde la capital de la reposera..."></textarea>
            </div>
            <div class="form-group">
                <label for="item-image">Imagen (Horizontal o Vertical - Se adapta sola):</label>
                <input type="file" id="item-image" accept="image/*">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="save-item-btn">Generar y Publicar en la Nube</button>
                <button id="cancel-edit-btn" class="btn-secondary hidden">Cancelar Edición</button>
            </div>
        </div>

        <!-- GALERÍA PÚBLICA -->
        <h2>Galería de Postales</h2>
        <div id="collection-grid" class="item-grid">
            <p>Conectando con la base de datos...</p>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE FIREBASE (albumestampiyadescarga)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSy... (poné tu apiKey)",
            authDomain: "albumestampiyadescarga.firebaseapp.com",
            projectId: "albumestampiyadescarga",
            storageBucket: "albumestampiyadescarga.appspot.com",
            messagingSenderId: "TUS_SENDER_ID",
            appId: "TUS_APP_ID"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function generateUniqueHash() {
            return "MDW-VY-" + Math.random().toString(36).substring(2, 8).toUpperCase() + "-" + Date.now().toString(36).toUpperCase();
        }

        function getAtomicTimestamp() {
            const d = new Date();
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const seconds = String(d.getSeconds()).padStart(2, '0');
            const ms = String(d.getMilliseconds()).padStart(3, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}.${ms}`;
        }

        function drawRoughOlivettiText(ctx, text, x, y) {
            ctx.font = "bold 20px 'Courier New', monospace";
            let currentX = x;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                ctx.fillStyle = (i % 3 === 0) ? "#111111" : "#2a2a2a";
                const jitterX = (Math.sin(i * 47) * 1.5);
                const jitterY = (Math.cos(i * 31) * 1.2);
                ctx.fillText(char, currentX + jitterX, y + jitterY);
                currentX += ctx.measureText(char).width + 1.2;
            }
        }

        function processMardelwoodPostalImage(file, titleText, userDesc, customTimestamp, customHash) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");

                        const isVertical = img.height > img.width;
                        const baseWidth = 1200;
                        const baseHeight = isVertical ? 1450 : 1120;

                        canvas.width = baseWidth;
                        canvas.height = baseHeight;

                        // Fondo postal
                        ctx.fillStyle = "#f8f4ec";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        // Bordes dentados
                        ctx.fillStyle = "#202124"; 
                        const holeRadius = 10;
                        const stepX = 40;
                        const stepY = 40;

                        for (let x = 20; x < canvas.width; x += stepX) {
                            ctx.beginPath(); ctx.arc(x, 0, holeRadius, 0, Math.PI * 2); ctx.fill();
                            ctx.beginPath(); ctx.arc(x, canvas.height, holeRadius, 0, Math.PI * 2); ctx.fill();
                        }
                        for (let y = 20; y < canvas.height; y += stepY) {
                            ctx.beginPath(); ctx.arc(0, y, holeRadius, 0, Math.PI * 2); ctx.fill();
                            ctx.beginPath(); ctx.arc(canvas.width, y, holeRadius, 0, Math.PI * 2); ctx.fill();
                        }

                        ctx.strokeStyle = "#b5a285";
                        ctx.lineWidth = 3;
                        ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);

                        // Imagen adaptativa
                        const margin = 30;
                        const imgAreaWidth = canvas.width - (margin * 2);
                        const imgAreaHeight = isVertical ? 920 : 650;
                        
                        let drawW = imgAreaWidth;
                        let drawH = (img.height * drawW) / img.width;
                        if (drawH > imgAreaHeight) {
                            drawH = imgAreaHeight;
                            drawW = (img.width * drawH) / img.height;
                        }
                        const drawX = margin + (imgAreaWidth - drawW) / 2;
                        const drawY = margin + 5;

                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(drawX - 5, drawY - 5, drawW + 10, drawH + 10);
                        ctx.strokeStyle = "#b5a285";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(drawX - 5, drawY - 5, drawW + 10, drawH + 10);
                        ctx.drawImage(img, drawX, drawY, drawW, drawH);

                        // Línea de tiempo
                        const tsBoxY = drawY + drawH + 15;
                        const tsBoxHeight = 75;
                        
                        ctx.fillStyle = "rgba(15, 18, 22, 0.96)";
                        ctx.fillRect(margin, tsBoxY, canvas.width - (margin * 2), tsBoxHeight);

                        ctx.strokeStyle = "#00ffff";
                        ctx.lineWidth = 2.5;
                        ctx.strokeRect(margin, tsBoxY, canvas.width - (margin * 2), tsBoxHeight);

                        ctx.fillStyle = "#00ffff";
                        ctx.font = "bold 25px monospace";
                        ctx.fillText(`[TS]: ${customTimestamp}`, margin + 25, tsBoxY + 32);
                        ctx.font = "bold 21px monospace";
                        ctx.fillText(`[HASH]: ${customHash}`, margin + 25, tsBoxY + 58);

                        // Texto Olivetti
                        const userTextY = tsBoxY + tsBoxHeight + 30;
                        const textToPrint = `"${userDesc || titleText}"`;
                        drawRoughOlivettiText(ctx, textToPrint, margin + 10, userTextY);

                        // Sellos
                        const footerY = userTextY + 25;

                        ctx.strokeStyle = "#0d47a1";
                        ctx.lineWidth = 3.5;
                        ctx.strokeRect(margin, footerY, 350, 95);
                        
                        ctx.fillStyle = "#0d47a1";
                        ctx.font = "bold 13px 'Courier New', monospace";
                        ctx.fillText("★ VENTANIYA SOLUCIONES ★", margin + 12, footerY + 22);
                        ctx.font = "bold 15px monospace";
                        ctx.fillStyle = "#111111";
                        ctx.fillText("TRAMITE MDW: VALOR 1 MK", margin + 12, footerY + 48);
                        ctx.font = "bold 12px sans-serif";
                        ctx.fillStyle = "#c62828";
                        ctx.fillText(`ID OFICIAL: ${titleText.toUpperCase()} (TASA: 10 PTOS)`, margin + 12, footerY + 76);

                        const stampRightX = canvas.width - margin - 350;
                        ctx.strokeStyle = "#b71c1c";
                        ctx.lineWidth = 4;
                        ctx.strokeRect(stampRightX, footerY, 350, 95);

                        ctx.fillStyle = "#b71c1c";
                        ctx.font = "bold 14px 'Courier New', monospace";
                        ctx.fillText("CORREO CÓSMICO MARDELWOOD", stampRightX + 15, footerY + 22);
                        ctx.font = "bold 13px monospace";
                        ctx.fillText("CAPITAL DE LA REPOSERA", stampRightX + 15, footerY + 48);
                        ctx.font = "italic bold 11px sans-serif";
                        ctx.fillStyle = "#222222";
                        ctx.fillText("HABILITADO GABINETE DE LUJO (5 LOBOMONEDAS)", stampRightX + 15, footerY + 76);

                        resolve(canvas.toDataURL("image/jpeg", 0.90));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        const saveItemBtn = document.getElementById("save-item-btn");
        const cancelEditBtn = document.getElementById("cancel-edit-btn");
        const formTitleHeading = document.getElementById("form-title-heading");
        const editIdInput = document.getElementById("edit-id");
        const collectionGrid = document.getElementById("collection-grid");

        // Escuchar cambios en tiempo real desde Firestore
        function escucharGaleria() {
            db.collection("postales_mardelwood").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                collectionGrid.innerHTML = "";
                if (snapshot.empty) {
                    collectionGrid.innerHTML = "<p>No hay postales todavía en la base de datos.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const id = docSnap.id;

                    const card = document.createElement("div");
                    card.className = "item-card";
                    card.innerHTML = `
                        <img src="${item.image}" alt="${item.title}">
                        <h3>${item.title}</h3>
                        <p><small>${item.desc || ""}</small></p>
                        <div class="card-actions">
                            <button class="btn-secondary download-btn" data-img="${item.image}" data-title="${item.title}">Descargar</button>
                            <button class="btn-secondary edit-btn" data-id="${id}" data-title="${item.title}" data-desc="${item.desc || ""}">Editar</button>
                            <button class="btn-danger delete-btn" data-id="${id}">Borrar</button>
                        </div>
                    `;
                    collectionGrid.appendChild(card);
                });

                activarBotonesAccion();
            });
        }

        saveItemBtn.addEventListener("click", async () => {
            const title = document.getElementById("item-title").value;
            const desc = document.getElementById("item-desc").value;
            const imageFile = document.getElementById("item-image").files[0];
            const editId = editIdInput.value;

            if (!title) {
                alert("Ingresá un título.");
                return;
            }
            if (!editId && !imageFile) {
                alert("Seleccioná una imagen.");
                return;
            }

            saveItemBtn.disabled = true;
            saveItemBtn.textContent = "Guardando en la nube...";

            try {
                let base64Image = null;
                if (imageFile) {
                    base64Image = await processMardelwoodPostalImage(imageFile, title, desc, getAtomicTimestamp(), generateUniqueHash());
                }

                if (editId) {
                    const updateData = { title, desc, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
                    if (base64Image) updateData.image = base64Image;
                    await db.collection("postales_mardelwood").doc(editId).update(updateData);
                } else {
                    await db.collection("postales_mardelwood").add({
                        title,
                        desc,
                        image: base64Image,
                        hash: generateUniqueHash(),
                        timestamp: getAtomicTimestamp(),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                resetForm();
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Hubo un error al guardar en Firebase.");
            } finally {
                saveItemBtn.disabled = false;
                saveItemBtn.textContent = "Generar y Publicar en la Nube";
            }
        });

        function activarBotonesAccion() {
            document.querySelectorAll(".download-btn").forEach(btn => {
                btn.onclick = (e) => {
                    const imgSrc = e.target.getAttribute("data-img");
                    const imgTitle = e.target.getAttribute("data-title") || "postal";
                    const a = document.createElement("a");
                    a.href = imgSrc;
                    a.download = `${imgTitle.replace(/\s+/g, '_')}_Mardelwood.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };
            });

            document.querySelectorAll(".edit-btn").forEach(btn => {
                btn.onclick = (e) => {
                    const id = e.target.getAttribute("data-id");
                    editIdInput.value = id;
                    document.getElementById("item-title").value = e.target.getAttribute("data-title");
                    document.getElementById("item-desc").value = e.target.getAttribute("data-desc");
                    formTitleHeading.textContent = "Editar Postal en la Nube";
                    saveItemBtn.textContent = "Guardar Cambios";
                    cancelEditBtn.classList.remove("hidden");
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
            });

            document.querySelectorAll(".delete-btn").forEach(btn => {
                btn.onclick = async (e) => {
                    if (confirm("¿Borrar esta postal de la base de datos?")) {
                        const id = e.target.getAttribute("data-id");
                        await db.collection("postales_mardelwood").doc(id).delete();
                    }
                };
            });
        }

        cancelEditBtn.addEventListener("click", resetForm);

        function resetForm() {
            editIdInput.value = "";
            document.getElementById("item-title").value = "";
            document.getElementById("item-desc").value = "";
            document.getElementById("item-image").value = "";
            formTitleHeading.textContent = "Crear Nueva Postal Caótica";
            saveItemBtn.textContent = "Generar y Publicar en la Nube";
            cancelEditBtn.classList.add("hidden");
        }

        escucharGaleria();
    </script>
</body>
</html>
